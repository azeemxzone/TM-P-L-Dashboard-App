name: tests
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test -- --run
